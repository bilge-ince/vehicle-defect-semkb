# =============================================================================
# nhtsa_text2sql_german.yaml — MULTILINGUAL RETRIEVAL GAP MEASUREMENT
#
#   eval/nhtsa_text2sql.yaml         WITH SemKB, comments in English (treatment)
#   eval/nhtsa_text2sql_naive.yaml   WITHOUT SemKB                   (control)
#   eval/nhtsa_text2sql_german.yaml  WITH SemKB, comments in German  <- here
#
# -----------------------------------------------------------------------------
# WHAT THIS MEASURES, AND WHY IT EXISTS
# -----------------------------------------------------------------------------
# README.md names two design-partnership asks for Mercedes-Benz. This file turns
# the first one from a claim into a number:
#
#   > Multilingual semantic retrieval. SemKB default embedding model is English.
#   > Mercedes COMMENT ON text will be German. Measure this before the meeting
#   > and present the real number, whatever it is. A gap you name yourself is a
#   > reason to partner; a gap they find is a reason to disengage.
#
# The experiment: take eval/nhtsa_text2sql.yaml and change EXACTLY ONE THING —
# the language of the COMMENT ON text. Identical fixture rows, identical
# questions (still English), identical ground truth, identical tools, identical
# instructions, identical models, identical threshold, identical embedding model
# (`bert`, all-MiniLM-L6-v2, 384 dims, English-only).
#
#     score(this file) - score(nhtsa_text2sql.yaml)  ==  the multilingual gap
#
# The `tests:` block is byte-identical to the English scenario; verify with:
#
#     diff <(awk "/^tests:/,0" eval/nhtsa_text2sql.yaml) \
#          <(awk "/^tests:/,0" eval/nhtsa_text2sql_german.yaml)
#
# Everything about how to run it, the exit codes, the model list, and the
# "this is NOT the Recall@K / Execution-Accuracy benchmark defined in
# SemKB_Benchmarking_Framework.md" caveat lives in the header of
# eval/nhtsa_text2sql.yaml. Read that first.
#
# -----------------------------------------------------------------------------
# success_threshold IS 0.75 — THE SAME AS THE ENGLISH SCENARIO, ON PURPOSE
# -----------------------------------------------------------------------------
# It would be easy, and dishonest, to lower this until the suite goes green.
# Do not. If German scores below 0.75 while English passes, the directory run
# exits 1 — and THAT FAILING EXIT CODE IS THE FINDING. It is the artefact you
# carry into the Mercedes conversation. A threshold tuned to hide it converts a
# credible admission into a discoverable omission.
#
# If you need a clean CI gate, point --scenarios at a directory containing only
# the English scenarios. Do not "fix" this number by editing this line.
#
# When the gap closes — bge-m3 as the KB model, or a better multilingual default
# — this file goes green on its own and no edit is needed. That is the property
# you want from a threshold.
# =============================================================================

scenario_name: nhtsa_text2sql_german
# Byte-identical to eval/nhtsa_text2sql.yaml, verbatim and in English.
# Translating the instructions too would move a second variable.
instructions: >-
  You answer questions about NHTSA vehicle defect data held in PostgreSQL schema
  "odi_eval". The physical column names are cryptic government identifiers
  (CMPLID, ODINO, COMPDESC, LDATE, DATEA, FAILDATE, OCCURENCES, POTAFF, ...).
  You must NEVER infer what a column means from its name.


  There is a Semantic Knowledge Base named nhtsa_eval_kb covering schema
  "odi_eval". Every table and column has been embedded together with its
  documented description. ALWAYS pass kb_name => 'nhtsa_eval_kb' explicitly to
  the retrieval tools; other knowledge bases may exist on this database and an
  omitted kb_name is an ambiguity error.


  Procedure for EVERY question:

  STEP 1 - DISCOVER. Call semantic_kb_search with the user question essentially
  verbatim as query_text. Do not translate it into column names first; that is
  the mistake this tool exists to prevent. Read relation_name, column_name and
  comment.

  STEP 2 - DISAMBIGUATE. If two or more columns could plausibly match, retrieve
  the definition of EACH one with get_column_definitions or search_by_comment
  and choose based on the comment text, not on the column name and not on your
  prior knowledge. This dataset has three different date columns that a careless
  reader would treat as interchangeable. They are not.

  STEP 3 - WRITE ONE QUERY. Only now call run_sql_query, once. Every column is
  TEXT, including dates, which are YYYYMMDD strings: slice them as text, e.g.
  substring(ldate FROM 1 FOR 4) = '2023'. Guard numeric casts with a regex test
  such as CASE WHEN occurences ~ '^[0-9]+$' THEN occurences::bigint ELSE 0 END.
  run_sql_query is read-only and will reject any write statement.

  STEP 4 - GROUND YOUR ANSWER. State the number, and name the
  fully-qualified column you relied on and the alternatives you rejected.


  If retrieval surfaces no column matching the concept in the question, SAY SO
  AND STOP. Do not substitute a column that is merely nearby. An honest "the
  semantic layer has no column for that" is a correct answer; a plausible query
  over the wrong column is not.


tools:
  - semantic_kb_search
  - get_entity_definitions
  - get_column_definitions
  - search_by_comment
  - run_sql_query

models:
  - gpt_5_6_terra_azure_responses
  - claude_opus_foundry
  - qwen3.5-0.8b-Q8_0

# Identical to the English scenario. See the banner: do not lower this.
success_threshold: 0.75

# -----------------------------------------------------------------------------
# seed_queries: identical to eval/nhtsa_text2sql.yaml EXCEPT the COMMENT ON
# block, which is German. The DDL, the ten complaint rows, the five recall rows
# and the create_semantic_kb call are byte-identical, so every ground-truth
# number in `tests:` below is unchanged.
# -----------------------------------------------------------------------------
seed_queries:
  # --- teardown -------------------------------------------------------------
  # delete_semantic_kb raises if the KB does not exist, so guard the first run.
  # All three scenario files use the SAME kb name on purpose: drop-then-create
  # of one fixed name is guaranteed to leave exactly one KB, which keeps
  # kb_name-omitting calls unambiguous even if a drop silently no-ops.
  - |-
    DO $seed$
    BEGIN
        PERFORM aidb.delete_semantic_kb('nhtsa_eval_kb');
    EXCEPTION WHEN OTHERS THEN
        NULL;
    END
    $seed$
  - "DROP SCHEMA IF EXISTS odi_eval CASCADE"
  - "CREATE SCHEMA odi_eval"

  # --- odi_eval.cmpl : consumer complaints ----------------------------------
  # Column names are the publisher's, verbatim and lowercased. All TEXT, because
  # the real flat file is dirty and lands as TEXT (see sql/01_schema.sql).
  - |-
    CREATE TABLE odi_eval.cmpl (
        cmplid      TEXT,
        odino       TEXT,
        mfr_name    TEXT,
        maketxt     TEXT,
        modeltxt    TEXT,
        yeartxt     TEXT,
        compdesc    TEXT,
        faildate    TEXT,
        ldate       TEXT,
        datea       TEXT,
        occurences  TEXT,
        deaths      TEXT,
        injured     TEXT,
        repaired_yn TEXT,
        cdescr      TEXT
    )
  # Ten rows, engineered so the three date columns give THREE DIFFERENT answers
  # for the same question. If they agreed, the test could not tell a grounded
  # answer from a lucky one.
  #
  #   AIR BAGS complaints in 2023 by LDATE    (filed with NHTSA)  = 3
  #   AIR BAGS complaints in 2023 by FAILDATE (defect occurred)   = 2
  #   AIR BAGS complaints in 2023 by DATEA    (added to the file) = 4
  #
  #   ALL complaints in 2023 by FAILDATE = 5,  by LDATE = 6,  by DATEA = 7
  #
  # Note the opposite pull of tests 1 and 2: one is answered by LDATE, the other
  # by FAILDATE. A model that simply always reaches for `faildate` (or always
  # for `datea`) scores 50% on the pair, not 100%. That is intentional.
  - |-
    INSERT INTO odi_eval.cmpl
        (cmplid, odino, mfr_name, maketxt, modeltxt, yeartxt, compdesc,
         faildate, ldate, datea, occurences, deaths, injured, repaired_yn, cdescr)
    VALUES
      ('1001','11001','MERCEDES-BENZ USA LLC','MERCEDES BENZ','C-CLASS','2019','AIR BAGS',
       '20221118','20230112','20230115','1','0','1','N',
       'Driver side air bag did not deploy in a low speed frontal collision.'),
      ('1002','11002','BMW OF NORTH AMERICA LLC','BMW','3-SERIES','2020','AIR BAGS',
       '20221230','20230210','20230212','2','0','0','Y',
       'Air bag warning lamp illuminated intermittently on two separate occasions.'),
      ('1003','11003','FORD MOTOR COMPANY','FORD','F-150','2018','AIR BAGS',
       '20230317','20230321','20230324','1','0','2','N',
       'Passenger air bag deployed without impact while driving on the highway.'),
      ('1004','11004','TOYOTA MOTOR ENGINEERING','TOYOTA','CAMRY','2021','AIR BAGS',
       '20231228','20240105','20240108','1','0','0','N',
       'Side curtain air bag failed to deploy during a rollover.'),
      ('1005','11005','AMERICAN HONDA MOTOR CO','HONDA','CIVIC','2017','SERVICE BRAKES',
       '20230419','20230425','20230427','3','0','0','Y',
       'Brake pedal went to the floor three times over a two week period.'),
      ('1006','11006','MERCEDES-BENZ USA LLC','MERCEDES BENZ','GLC','2022','SERVICE BRAKES',
       '20220830','20220905','20220908','1','0','0','N',
       'Grinding noise from the front brakes and extended stopping distance.'),
      ('1007','11007','BMW OF NORTH AMERICA LLC','BMW','X5','2019','ELECTRICAL SYSTEM',
       '20230715','20230720','20230722','1','0','0','N',
       'Complete loss of electrical power while merging onto a motorway.'),
      ('1008','11008','VOLKSWAGEN GROUP OF AMERICA','VOLKSWAGEN','GOLF','2020','ENGINE',
       '20240102','20240110','20240112','2','0','0','N',
       'Engine stalled twice at idle and would not restart for ten minutes.'),
      ('1009','11009','FORD MOTOR COMPANY','FORD','EXPLORER','2021','AIR BAGS',
       '20211105','20211112','20230103','1','1','0','N',
       'Air bag deployed late in a frontal crash.'),
      ('1010','11010','TOYOTA MOTOR ENGINEERING','TOYOTA','RAV4','2018','ENGINE',
