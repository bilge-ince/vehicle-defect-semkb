  # --- odi_eval.rcl : safety recall campaigns -------------------------------
  # Note `conequence_defect` — the publisher's misspelling of "consequence",
  # kept verbatim, and `datea` again with a DIFFERENT meaning from cmpl.datea.
  - |-
    CREATE TABLE odi_eval.rcl (
        record_id         TEXT,
        campno            TEXT,
        maketxt           TEXT,
        modeltxt          TEXT,
        yeartxt           TEXT,
        compname          TEXT,
        mfgname           TEXT,
        rcdate            TEXT,
        datea             TEXT,
        potaff            TEXT,
        desc_defect       TEXT,
        conequence_defect TEXT
    )
  # Five rows, containing TWO deliberate near-misses that punish a sloppy join:
  #   * TOYOTA RAV4 2018 has a complaint for compdesc 'ENGINE' but a recall for
  #     compname 'ENGINE AND ENGINE COOLING' — same concept, different string.
  #   * FORD EXPLORER 2021 has a complaint for AIR BAGS but a recall for
  #     ELECTRICAL SYSTEM — same vehicle, different component.
  # Exact component matching therefore yields exactly 3 makes:
  #   BMW, HONDA, MERCEDES BENZ.
  - |-
    INSERT INTO odi_eval.rcl
        (record_id, campno, maketxt, modeltxt, yeartxt, compname, mfgname,
         rcdate, datea, potaff, desc_defect, conequence_defect)
    VALUES
      ('9001','23V101000','MERCEDES BENZ','C-CLASS','2019','AIR BAGS','MERCEDES-BENZ USA LLC',
       '20230405','20230410','12500',
